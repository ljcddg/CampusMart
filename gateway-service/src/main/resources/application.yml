server:
  port: 7000

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      # 关闭自动按服务名生成路由，统一由下方显式路由管理
      discovery:
        locator:
          enabled: false
      routes:
        # 秒杀接口单独一条路由，叠加令牌桶限流（粗粒度兜底，防超卖不依赖它）
        - id: seckill-route
          uri: lb://trade-service
          predicates:
            - Path=/trade/seckill/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2000
                redis-rate-limiter.burstCapacity: 5000
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/product/**
        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/trade/**
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0

campusmart:
  jwt:
    secret: campusmart-secret-key-must-be-at-least-32-bytes-long
    expire-minutes: 1440

logging:
  level:
    com.campusmart: info
    org.springframework.cloud.gateway: info
